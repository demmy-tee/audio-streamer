name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------------------
  # 1. API Service Verification
  # ----------------------------------------------------------------------------
  api-service:
    name: Lint API Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linting Tools
        run: pip install ruff
      - name: Run Ruff on API Service
        run: ruff check services/api/

  # ----------------------------------------------------------------------------
  # 2. Worker Service Verification
  # ----------------------------------------------------------------------------
  worker-service:
    name: Lint Worker Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linting Tools
        run: pip install ruff
      - name: Run Ruff on Worker Service
        run: ruff check services/worker/

  # ----------------------------------------------------------------------------
  # 3. Docker Container Build Verification
  # ----------------------------------------------------------------------------
  docker-builds:
    name: Test Docker Builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build API Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./services/api
          file: ./services/api/Dockerfile
          push: false

      - name: Test Build Worker Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./services/worker
          file: ./services/worker/Dockerfile
          push: false

      - name: Test Build Frontend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          push: false