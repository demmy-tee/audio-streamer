[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",      # Line length handled gracefully
    "B008",      # FastAPI Depends in function defaults is standard
    "ASYNC230",  # Local sample file reading
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
