services:
  # 1. Next.js 16 Web Dashboard (CommitStream Frontend) - 100% Free ($0.00)
  - type: web
    name: audio-frontend
    runtime: node
    rootDir: services/frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: audio-api
          property: hostport
      - key: NEXT_PUBLIC_API_URL
        value: ""

  # 2. FastAPI Web API & Streaming Service - 100% Free ($0.00)
  - type: web
    name: audio-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: audio-postgres
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app,http://localhost:3000"
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

# 3. Managed PostgreSQL Database - 100% Free ($0.00)
databases:
  - name: audio-postgres
    plan: free
    region: oregon
    databaseName: commitments_db
    user: commitments_user
