version: "3.8"

networks:
  audio-network:
    name: audio-network
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 - Relational Metadata & Audit Store
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: audio-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: commitments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commitments_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - audio-network

  # ----------------------------------------------------------------------------
  # 2. Redis 7.2 - Task Broker & Audio SHA-256 Fingerprint Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: audio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - audio-network

  # ----------------------------------------------------------------------------
  # 3. MinIO - S3 Compatible Object Storage for Audio & Range Streaming
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: audio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API Port
      - "9001:9001"   # Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - audio-network

  # ----------------------------------------------------------------------------
  # 4. Backend Web API (FastAPI) - REST API & HTTP 206 Audio Range Streaming
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: audio-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/commitments_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET_NAME=audio-streamer-records
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./services/api:/app
    networks:
      - audio-network

  # ----------------------------------------------------------------------------
  # 5. Background Worker - Whisper STT & LLM Commitment Extraction
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: audio-worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/commitments_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET_NAME=audio-streamer-records
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./services/worker:/app
    networks:
      - audio-network

  # ----------------------------------------------------------------------------
  # 6. Frontend (Next.js 16) - Interactive Player & Commitments Dashboard
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: audio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - audio-network